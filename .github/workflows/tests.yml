name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: install dependencies
        run: uv sync --frozen
      - name: run tests
        run: uv run pytest
      - name: lint
        run: uv run ruff check .
      - name: format check
        run: uv run ruff format --check .
