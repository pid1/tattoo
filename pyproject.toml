[project]
name = "tattoo"
version = "0.1.0"
description = "daily feed digest with an llm usefulness gate, served on the home tailnet"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# black and ruff format both run in CI. ruff reads line-length from
# [tool.ruff]; black does not, and would otherwise wrap at its default 88,
# so the two disagree on every line between 88 and 100 characters.
[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# E501: line length is advisory; B008: fastapi Depends() defaults are the framework idiom
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the app is a src-layout package that runs with src on PYTHONPATH rather
# than being installed (rally convention)
pythonpath = ["src"]

# supply-chain cooldown. the relative form keeps the window rolling; an absolute
# timestamp would freeze the lock.
[tool.uv]
exclude-newer = "7 days"

