[project]
name = "tattoo"
version = "0.1.0"
description = "daily feed digest with an llm usefulness gate, served on the home tailnet"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Supply-chain cooldown: only resolve releases that have been public for at
# least 7 days (factory policy). Relative, so the window rolls forward.
[tool.uv]
exclude-newer = "7 days"
# Cooldown exception (factory 2026-10-22, remove next run): certifi
# 2026.10.19 drops the distrusted "emSign ECC Root CA - G3" root
# (Semgrep ssc-5df0a6b6-da47-4290-9f7c-28111c57478b). It is under 7 days old.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

# black and ruff format both run in CI. ruff reads line-length from
# [tool.ruff]; black does not, and would otherwise wrap at its default 88,
# so the two disagree on every line between 88 and 100 characters.
[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# E501: line length is advisory; B008: fastapi Depends() defaults are the framework idiom
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the app is a src-layout package that runs with src on PYTHONPATH rather
# than being installed (rally convention)
pythonpath = ["src"]
